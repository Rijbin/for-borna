<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&family=JetBrains+Mono:wght@400&display=swap');

        :root {
            --bg: #030303;
            --surface: rgba(25, 25, 25, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #e60000;
            --text: #f2f2f2;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Premium Grain overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 50;
        }

        /* Cinematic Glow */
        .glow-ring {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(230,0,0,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .glass-modal {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff4d4d;
            margin-bottom: 24px;
            display: inline-block;
            background: rgba(230, 0, 0, 0.1);
            padding: 6px 12px;
            border-radius: 100px;
            border: 1px solid rgba(230, 0, 0, 0.15);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 35px;
            line-height: 1.5;
            font-weight: 300;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            min-height: 120px;
            align-items: center;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-yes {
            background: var(--text);
            color: var(--bg);
            border: none;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.2);
            background: #ffffff;
        }

        .btn-no {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            position: relative;
            z-index: 20;
        }

        .is-moving {
            position: fixed !important;
            transition: top 0.3s cubic-bezier(0.25, 1, 0.5, 1), left 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s ease !important;
            box-shadow: 0 15px 35px rgba(230, 0, 0, 0.25);
            border-color: rgba(230, 0, 0, 0.4);
            color: #ff4d4d;
            background: rgba(15, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            width: auto !important;
            min-width: 160px;
        }

        .success-state {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .success-state h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff4d4d;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(230, 0, 0, 0.4);
        }

        .success-state p {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .branding {
            position: absolute;
            bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #333;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="glow-ring"></div>

    <div class="glass-modal" id="modal">
        <div id="initial-view">
            <div class="badge">System Alert</div>
            <h1>I hate you Borna!</h1>
            <p class="subtitle">Please confirm your acknowledgment of this undeniable fact.</p>
            
            <div class="actions" id="action-area">
                <button class="btn-yes" onclick="acceptTruth()">I Know</button>
                <button class="btn-no" id="btn-no">No you don't</button>
            </div>
        </div>

        <div class="success-state" id="success-view">
            <h2>I HATE YOU MORE 🖤</h2>
            <p>STATUS: DELIVERED</p>
        </div>
    </div>

    <div class="branding">the.rb.duo</div>

    <script>
        const noBtn = document.getElementById('btn-no');
        const initialView = document.getElementById('initial-view');
        const successView = document.getElementById('success-view');
        let isFirstMove = true;

        function moveButton(e) {
            if (e.type === 'touchstart') e.preventDefault();

            if (isFirstMove) {
                noBtn.classList.add('is-moving');
                isFirstMove = false;
            }

            const padding = 25;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            const newX = Math.max(padding, Math.floor(Math.random() * maxX));
            const newY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
            
            const rot = Math.floor(Math.random() * 12) - 6;
            noBtn.style.transform = `rotate(${rot}deg) scale(1.02)`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton, {passive: false});
        noBtn.addEventListener('click', moveButton); 

        function acceptTruth() {
            initialView.style.display = 'none';
            successView.style.display = 'block';
            noBtn.style.display = 'none'; 
        }
    </script>
</body>
</html>
